name: Deploy

# Push to main: build the API image, ship it to the server. CI gates (tests) are temporarily NOT part of this
# pipeline; they still run on pull requests (ci.yml). To restore them, add a `ci` job that calls ci.yml and
# make `changes` need it.
# The web image is built and shipped by the web repository (marketing_front_itbcpro).
# Configuration lives in GitHub, never in the repository (see docs/deploy.md):
#   secrets:   DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, POSTGRES_PASSWORD, REDIS_PASSWORD, APP_SECRET_KEY,
#              APP_VAULT_MASTER_KEYS, APP_JWT_SIGNING_KEYS, DEPLOY_EXTRA_ENV (optional, provider keys)
#   variables: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_PORT (optional), DEPLOY_CONFIG (all non-secret settings)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: Rebuild the image and redeploy
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
      config: ${{ steps.diff.outputs.config }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ inputs.force_all }}
        run: |
          all() { printf 'api=true\nconfig=true\n' >> "$GITHUB_OUTPUT"; }
          if [ "$FORCE" = "true" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then all; exit 0; fi
          files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          flag() { echo "$files" | grep -Eq "$2" && echo "$1=true" || echo "$1=false"; }
          flag api '^(apps/api/|locale/|tools/compile_messages\.py)' >> "$GITHUB_OUTPUT"
          flag config '^(docker-compose\.prod\.yml|infra/deploy/)' >> "$GITHUB_OUTPUT"

  build-api:
    name: Build API image
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to server
    needs: [changes, build-api]
    # Run when nothing failed and an image was built or the deploy configuration changed.
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.result == 'success'
      && (needs.changes.outputs.api == 'true' || needs.changes.outputs.config == 'true') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare deploy bundle
        env:
          DEPLOY_CONFIG: ${{ vars.DEPLOY_CONFIG }}
          DEPLOY_EXTRA_ENV: ${{ secrets.DEPLOY_EXTRA_ENV }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          APP_VAULT_MASTER_KEYS: ${{ secrets.APP_VAULT_MASTER_KEYS }}
          APP_JWT_SIGNING_KEYS: ${{ secrets.APP_JWT_SIGNING_KEYS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_API: ${{ needs.build-api.result == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir bundle
          for name in DEPLOY_CONFIG POSTGRES_PASSWORD REDIS_PASSWORD APP_SECRET_KEY APP_VAULT_MASTER_KEYS APP_JWT_SIGNING_KEYS; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; exit 1; fi
          done
          # Later lines win: the dedicated secrets override anything in the free-form blocks.
          {
            printf '%s\n' "$DEPLOY_CONFIG"
            printf '%s\n' "$DEPLOY_EXTRA_ENV"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
            printf 'APP_SECRET_KEY=%s\n' "$APP_SECRET_KEY"
            printf 'APP_VAULT_MASTER_KEYS=%s\n' "$APP_VAULT_MASTER_KEYS"
            printf 'APP_JWT_SIGNING_KEYS=%s\n' "$APP_JWT_SIGNING_KEYS"
          } > bundle/.env
          printf '%s' "$GHCR_TOKEN" > bundle/ghcr_token
          cp docker-compose.prod.yml bundle/
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "GHCR_USER=$GITHUB_ACTOR"
            echo "API_IMAGE=$repo/api"
            if [ "$BUILT_API" = "true" ]; then echo "API_TAG=$GITHUB_SHA"; fi
          } > bundle/images.env
          tar -C bundle -cf bundle.tar .env images.env docker-compose.prod.yml ghcr_token
      - name: Ship it
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          umask 077
          install -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$HOST" deploy < bundle.tar
      - name: Clean up
        if: always()
        run: rm -rf bundle bundle.tar ~/.ssh/deploy_key
