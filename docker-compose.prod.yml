# Production stack. Deployed by .github/workflows/deploy.yml; never edited on the server.
# Every value comes from the env file the pipeline writes (see docs/deploy.md); nothing is hard-coded here.
# Only the web container is published, and only on loopback: the host nginx terminates TLS and proxies to it.

name: ${COMPOSE_PROJECT:?set COMPOSE_PROJECT}

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-app-env: &app-env
  env_file: [.env]
  environment:
    APP_ENVIRONMENT: prod
    APP_DEBUG: "false"
    APP_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    APP_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    APP_MEDIA_ROOT: /data/media

services:
  postgres:
    <<: *hardening
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    read_only: false
    cap_drop: []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *hardening
    image: ${REDIS_IMAGE:?set REDIS_IMAGE}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: [*hardening, *app-env]
    image: ${API_IMAGE:?}:${API_TAG:?}
    volumes:
      - media:/data/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: ${API_MEM_LIMIT:-1g}

  worker:
    <<: [*hardening, *app-env]
    image: ${API_IMAGE}:${API_TAG}
    command: ["celery", "-A", "config", "worker", "--pool=threads", "--concurrency=${WORKER_CONCURRENCY:-4}", "-Q", "default,agents,reports,media,low,ingest.social,publish.social", "-l", "${APP_LOG_LEVEL:-INFO}"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME -t 5 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - media:/data/media
    depends_on:
      api: { condition: service_healthy }
    mem_limit: ${WORKER_MEM_LIMIT:-1g}

  beat:
    <<: [*hardening, *app-env]
    image: ${API_IMAGE}:${API_TAG}
    command: ["celery", "-A", "config", "beat", "-s", "/tmp/celerybeat-schedule", "-l", "${APP_LOG_LEVEL:-INFO}"]
    healthcheck:
      disable: true
    depends_on:
      api: { condition: service_healthy }
    mem_limit: ${BEAT_MEM_LIMIT:-256m}

  web:
    <<: *hardening
    image: ${WEB_IMAGE:?}:${WEB_TAG:?}
    environment:
      API_URL: http://api:8000
      NODE_ENV: production
    tmpfs: ["/tmp", "/app/.next/cache"]
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:?set WEB_HOST_PORT}:3000"
    depends_on:
      api: { condition: service_healthy }
    mem_limit: ${WEB_MEM_LIMIT:-768m}

volumes:
  postgres_data:
  redis_data:
  media:
